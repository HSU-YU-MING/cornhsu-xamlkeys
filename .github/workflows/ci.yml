name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # ⚠ 全部的 action 釘 40 碼 commit SHA（行尾註解標版本）。
      #    dependabot 的 github-actions 會更新釘選；不要改回 @v4 這種移動 tag。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore XamlKeys.slnx

      - name: Build
        run: dotnet build XamlKeys.slnx -c Release --no-restore

      - name: Test
        run: dotnet test XamlKeys.slnx -c Release --no-build --verbosity normal

      # 示範專案是刻意做壞的：預期 exit 3（有一本外部字典讀不到,覆蓋率 66.7% < 80%）。
      # ⚠ 退出碼的判定順序規定「不可信」優先於「有違規」—— 這一步同時驗了那個順序。
      - name: Demo without the coverage floor lowered (expects exit 3)
        run: |
          set +e
          dotnet run --project src/XamlKeys.Cli -c Release --no-build -- samples/demo
          code=$?
          set -e
          if [ "$code" -ne 3 ]; then echo "expected exit 3, got $code"; exit 1; fi

      # 把覆蓋率下限關掉之後,決定退出碼的是 finding（demo 有一筆 fail 級）
      - name: Demo with the floor lowered (expects exit 1 and exact counts)
        run: |
          set +e
          dotnet run --project src/XamlKeys.Cli -c Release --no-build -- \
            samples/demo --min-coverage 0 --json demo.json
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then echo "expected exit 1, got $code"; exit 1; fi

      # 對計數下斷言。這同時驗了「工具真的會擋」跟「擋的數量沒有莫名其妙變動」——
      # 改了規則導致誤判變多,這裡立刻紅。
      - name: Assert the demo counts
        run: |
          jq -e '
            .summary.counts.danglingStatic    == 1 and
            .summary.counts.danglingDynamic   == 1 and
            .summary.counts.duplicateKey      == 1 and
            .summary.counts.outOfScope        == 1 and
            .summary.counts.shadowed          == 3 and
            .summary.counts.shadowedIdentical == 1 and
            .summary.counts.unused            == 4 and
            .summary.counts.orphanDictionary  == 1 and
            .summary.counts.external          == 1 and
            .summary.suppressed               >= 1
          ' demo.json > /dev/null

      - name: SARIF omits info-level findings
        run: |
          dotnet run --project src/XamlKeys.Cli -c Release --no-build -- \
            samples/demo --min-coverage 0 --sarif demo.sarif || true
          jq -e '[.runs[0].results[] | select(.level == "note")] | length == 0' demo.sarif > /dev/null

      - name: README sample is up to date
        shell: pwsh
        run: ./scripts/verify-readme-sample.ps1

      # README 的 Action 範例釘的版本要等於 CHANGELOG 最新的已發佈版本（XamlFit 0.3.0 發完才發現還釘著 0.1.0）
      - name: README pins the released version
        run: bash scripts/verify-readme-facts.sh

  # 真的跑一次 action.yml：單元測試只看得到文字，看不到 jq 註記、stop-commands、PR 留言、最後一步才擋有沒有接起來。
  # 照 XamlFit 的 action job。差別在工具從哪裡裝：
  #   這一版的 Action 會傳 --md（0.3.0 才有的旗標），nuget.org 上的 0.2.0 不認得、Run audit 會 exit 2 —— 那樣測到的是版本錯配，
  #   不是殼。所以先把這個 commit 的 CLI 打包成本機來源，用 `version` 釘住它：Action 的安裝步驟照真的走
  #   （`dotnet tool install --global … --version`），裝到的是同一個 commit 的工具，跟使用者「@vX.Y.Z 與 version: X.Y.Z 一起釘」一樣。
  action:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      # 使用者層級的 NuGet 設定多一個本機來源：Action 的 `dotnet tool install --global` 在 workspace 根目錄跑，讀得到它。
      # 版本號每次 run 都不一樣（同一個版本號第二次 pack，install 會拿快取裡的舊檔）
      - name: Pack this commit's CLI into a local feed
        id: pack
        run: |
          v="0.0.0-ci.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          dotnet pack src/XamlKeys.Cli/XamlKeys.Cli.csproj -c Release -o "$RUNNER_TEMP/feed" -p:Version="$v"
          cfg="$HOME/.nuget/NuGet/NuGet.Config"
          if [ ! -f "$cfg" ]; then
            mkdir -p "$(dirname "$cfg")"
            printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<configuration><packageSources><add key="nuget.org" value="https://api.nuget.org/v3/index.json" /></packageSources></configuration>' > "$cfg"
          fi
          dotnet nuget add source "$RUNNER_TEMP/feed" --name xamlkeys-ci --configfile "$cfg"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # 示範專案是刻意做壞的：gate 一定要紅，而且報告與註記要在紅之前就出去。
      # min-coverage 0：預設下限是 exit 3（一本外部字典讀不到），放寬之後決定退出碼的是 finding（exit 1）。
      # comment 用預設的 true：這個 workflow 只有 contents: read，PR 上那一步會 403 —— 它是 continue-on-error，
      # 這裡同時驗了「沒給 pull-requests: write 不會讓 job 紅在留言那步」（紅的原因要是 gate，下一步會確認報告都在）
      - name: Run the action on the demo (expects the gate to fail)
        id: demo
        continue-on-error: true
        uses: ./
        with:
          root: samples/demo
          min-coverage: 0
          version: ${{ steps.pack.outputs.version }}
          artifact-name: xamlkeys-demo-report
      - name: The gate failed and the reports were written
        env:
          OUTCOME: ${{ steps.demo.outcome }}
          VERSION: ${{ steps.pack.outputs.version }}
        run: |
          report="$RUNNER_TEMP/xamlkeys-report.json"
          md="$RUNNER_TEMP/xamlkeys-report.md"
          test "$OUTCOME" = failure || { echo "expected the demo to fail the gate, got $OUTCOME"; exit 1; }
          test -s "$report" || { echo "no JSON report"; exit 1; }
          n=$(jq '.findings | length' "$report")
          test "$n" -gt 0 || { echo "the report has no findings"; exit 1; }
          # 裝到的是這個 commit 打包的工具，不是 nuget.org 上的
          got=$(jq -r '.toolVersion' "$report")
          test "$got" = "$VERSION" || { echo "expected tool $VERSION, the report says $got"; exit 1; }
          test -s "$md" || { echo "no Markdown report"; exit 1; }
          test "$(head -n 1 "$md")" = "## XamlKeys - resource key audit" || { echo "unexpected Markdown header"; exit 1; }
          grep -qF ':x: **FAIL**' "$md" || { echo "the Markdown verdict does not say FAIL"; exit 1; }
          echo "ok: gate failed, $n finding(s) in the report, Markdown written"

      # 壞的輸入要在裝任何東西之前 exit 2，不能變成預設值（Action 的 fail-on 只收小寫的 fail／warn）
      - name: A bad input is refused
        id: bad
        continue-on-error: true
        uses: ./
        with:
          root: samples/demo
          fail-on: Warn
          upload-report: false
      - name: The bad input failed the step
        env:
          OUTCOME: ${{ steps.bad.outcome }}
        run: |
          test "$OUTCOME" = failure || { echo "expected fail-on: Warn to be refused, got $OUTCOME"; exit 1; }

  # 解析引擎是純 XML,不依賴 WPF runtime —— 這個 job 守住那句話。
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test XamlKeys.slnx -c Release
