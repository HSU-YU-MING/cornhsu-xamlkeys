name: 'XamlKeys resource key audit'
description: 'Static scope audit for XAML resource keys: dangling references, duplicate and shadowed keys, unused keys.'
author: 'Cornhsu'

branding:
  icon: 'key'
  color: 'blue'

inputs:
  root:
    description: 'Folder to scan'
    required: false
    default: '.'
  config:
    description: 'Path to xamlkeys.config.json'
    required: false
  baseline:
    description: 'Path to a baseline file; only findings outside it are reported'
    required: false
  fail-on:
    description: "Gate level: 'fail' (default) or 'warn'"
    required: false
    default: 'fail'
  min-coverage:
    description: 'Minimum share of merged dictionaries that must resolve (0-100)'
    required: false
    default: '80'
  sarif:
    description: 'Write a SARIF report to this path'
    required: false
  json:
    description: 'Write the JSON report to this path'
    required: false
  version:
    description: 'Version of Cornhsu.XamlKeys to install (default: latest)'
    required: false

runs:
  using: 'composite'
  steps:
    # ⚠ 所有 input 一律經由 env 進 shell，**不要**寫成 run: 裡的 ${{ inputs.x }}。
    #    ${{ }} 是在 shell 看到腳本之前就做文字代換的：呼叫端只要把一個
    #    PR 作者控制得到的值（分支名、標題、檔名）接到 input 上，
    #    那個值就會被當成指令執行。走 env 的話它永遠只是一個字串。
    - name: Install XamlKeys
      shell: bash
      env:
        XK_VERSION: ${{ inputs.version }}
      run: |
        if [ -n "$XK_VERSION" ]; then
          dotnet tool install -g Cornhsu.XamlKeys --version "$XK_VERSION"
        else
          dotnet tool install -g Cornhsu.XamlKeys
        fi
        echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

    - name: Run XamlKeys
      shell: bash
      env:
        XK_ROOT: ${{ inputs.root }}
        XK_CONFIG: ${{ inputs.config }}
        XK_BASELINE: ${{ inputs.baseline }}
        XK_SARIF: ${{ inputs.sarif }}
        XK_JSON: ${{ inputs.json }}
        XK_FAIL_ON: ${{ inputs.fail-on }}
        XK_MIN_COVERAGE: ${{ inputs.min-coverage }}
      run: |
        args=()
        [ -n "$XK_CONFIG" ]   && args+=(--config "$XK_CONFIG")
        [ -n "$XK_BASELINE" ] && args+=(--baseline "$XK_BASELINE")
        [ -n "$XK_SARIF" ]    && args+=(--sarif "$XK_SARIF")
        [ -n "$XK_JSON" ]     && args+=(--json "$XK_JSON")
        args+=(--fail-on "$XK_FAIL_ON")
        args+=(--min-coverage "$XK_MIN_COVERAGE")
        # ⚠ 路徑一律放在 -- 之後：沒有這個出口的話,一個叫 --version 的資料夾
        #    會被當成旗標（印版本、exit 0、什麼都沒稽核）
        xamlkeys "${args[@]}" -- "$XK_ROOT"
